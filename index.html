<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Concursos Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0c;--surface:#111114;--surface2:#1a1a1f;--surface3:#222228;
      --border:#2a2a32;--border2:#363640;
      --accent:#e8a020;--accent2:#f0c060;--accentd:#b87818;
      --text:#f0f0f0;--text2:#a0a0b0;--text3:#606070;
      --red:#e05050;--green:#40c080;
      --sidebar:280px;--radius:10px;
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

    /* ── LOGIN ── */
    #loginScreen{
      position:fixed;inset:0;background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      z-index:100;
    }
    .login-box{
      background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:48px 40px;text-align:center;
      max-width:420px;width:90%;
    }
    .login-logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:6px}
    .login-sub{color:var(--text2);font-size:.85rem;margin-bottom:32px}
    .btn-google{
      display:inline-flex;align-items:center;gap:10px;
      background:#fff;color:#333;border:none;border-radius:9px;
      padding:13px 28px;font-size:.95rem;font-weight:600;
      cursor:pointer;transition:opacity .2s;font-family:'Inter',sans-serif;
    }
    .btn-google:hover{opacity:.9}
    .btn-google svg{width:20px;height:20px}

    /* ── TOPBAR ── */
    #app{display:flex;flex-direction:column;height:100%;display:none}
    .topbar{
      height:52px;background:var(--surface);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;
    }
    .topbar-logo{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--accent)}
    .topbar-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
    .topbar-title{font-size:.82rem;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-info{display:flex;align-items:center;gap:8px;margin-left:auto}
    .user-info img{width:26px;height:26px;border-radius:50%;border:1px solid var(--border)}
    .user-info span{font-size:.78rem;color:var(--text2)}
    .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
    .btn-sm:hover{border-color:var(--accent);color:var(--accent)}

    /* ── MAIN LAYOUT ── */
    .main{display:flex;flex:1;overflow:hidden}

    /* ── SIDEBAR ── */
    .sidebar{
      width:var(--sidebar);background:var(--surface);
      border-right:1px solid var(--border);
      display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
    }
    .sidebar-header{
      padding:14px 16px 10px;border-bottom:1px solid var(--border);
      font-family:'Syne',sans-serif;font-size:.75rem;font-weight:600;
      color:var(--text3);text-transform:uppercase;letter-spacing:.08em;
      display:flex;align-items:center;gap:8px;
    }
    .breadcrumb{
      padding:8px 16px;display:flex;align-items:center;gap:6px;
      border-bottom:1px solid var(--border);min-height:36px;flex-wrap:wrap;
    }
    .bc-item{font-size:.75rem;color:var(--text3);cursor:pointer;transition:color .2s;white-space:nowrap}
    .bc-item:hover{color:var(--accent)}
    .bc-sep{font-size:.7rem;color:var(--text3)}
    .bc-item.active{color:var(--text2)}
    .sidebar-list{flex:1;overflow-y:auto;padding:6px 0}
    .sidebar-list::-webkit-scrollbar{width:4px}
    .sidebar-list::-webkit-scrollbar-track{background:transparent}
    .sidebar-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .s-item{
      display:flex;align-items:center;gap:10px;
      padding:9px 16px;cursor:pointer;transition:background .15s;
      border-left:2px solid transparent;
    }
    .s-item:hover{background:var(--surface2)}
    .s-item.active{background:var(--surface2);border-left-color:var(--accent)}
    .s-item.playing{border-left-color:var(--green)}
    .s-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
    .s-name{font-size:.8rem;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
    .s-item.active .s-name,.s-item:hover .s-name{color:var(--text)}
    .s-item.playing .s-name{color:var(--green)}
    .s-badge{font-size:.65rem;background:var(--surface3);color:var(--text3);border-radius:4px;padding:1px 5px;flex-shrink:0}
    .playing-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

    /* ── VIDEO AREA ── */
    .content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .video-section{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
    .video-container{
      flex:1;background:#000;position:relative;overflow:hidden;
      display:flex;align-items:center;justify-content:center;min-height:0;
    }
    #videoEl{width:100%;height:100%;object-fit:contain;display:block}
    .video-overlay{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;
    }
    .video-container:hover .video-overlay{opacity:1;pointer-events:all}
    .play-big{
      width:64px;height:64px;background:rgba(255,255,255,.15);
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      cursor:pointer;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);
      transition:transform .2s,background .2s;
    }
    .play-big:hover{transform:scale(1.1);background:rgba(255,255,255,.25)}
    .play-big svg{width:28px;height:28px;fill:#fff}

    /* ── CONTROLS ── */
    .controls{
      background:var(--surface);border-top:1px solid var(--border);
      padding:10px 16px 12px;flex-shrink:0;
    }
    .progress-wrap{position:relative;margin-bottom:10px;cursor:pointer}
    .progress-bg{height:4px;background:var(--surface3);border-radius:2px;transition:height .15s}
    .progress-wrap:hover .progress-bg{height:6px}
    .progress-fill{height:100%;background:var(--accent);border-radius:2px;position:relative;pointer-events:none}
    .progress-fill::after{
      content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);
      width:10px;height:10px;background:var(--accent);border-radius:50%;
      opacity:0;transition:opacity .15s;
    }
    .progress-wrap:hover .progress-fill::after{opacity:1}
    .controls-row{display:flex;align-items:center;gap:12px}
    .ctrl-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;border-radius:6px;transition:color .2s,background .2s;display:flex;align-items:center;justify-content:center}
    .ctrl-btn:hover{color:var(--text);background:var(--surface2)}
    .ctrl-btn svg{width:18px;height:18px;fill:currentColor}
    .ctrl-btn.play-pause svg{width:22px;height:22px}
    .time-display{font-size:.78rem;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
    .volume-wrap{display:flex;align-items:center;gap:6px}
    .volume-slider{width:70px;height:3px;-webkit-appearance:none;background:var(--surface3);border-radius:2px;cursor:pointer;outline:none}
    .volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent)}
    .speed-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--text2);
      border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer;
      font-family:'Inter',sans-serif;transition:all .2s;position:relative;
    }
    .speed-btn:hover{border-color:var(--accent);color:var(--accent)}
    .speed-menu{
      position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
      background:var(--surface);border:1px solid var(--border);border-radius:8px;
      padding:4px 0;min-width:80px;display:none;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.5);
    }
    .speed-menu.open{display:block}
    .speed-opt{padding:7px 14px;font-size:.8rem;color:var(--text2);cursor:pointer;text-align:center;transition:background .15s}
    .speed-opt:hover{background:var(--surface2);color:var(--text)}
    .speed-opt.active{color:var(--accent)}
    .fullscreen-btn{margin-left:auto}
    .no-video{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;color:var(--text3);gap:12px;
    }
    .no-video-icon{font-size:48px;opacity:.3}
    .no-video p{font-size:.88rem}

    /* ── FILES PANEL ── */
    .files-panel{
      height:140px;border-top:1px solid var(--border);
      background:var(--surface);flex-shrink:0;display:flex;flex-direction:column;
    }
    .files-header{
      padding:8px 16px;border-bottom:1px solid var(--border);
      font-size:.72rem;color:var(--text3);text-transform:uppercase;
      letter-spacing:.08em;font-weight:500;display:flex;align-items:center;gap:6px;
    }
    .files-list{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;flex:1;align-items:center}
    .files-list::-webkit-scrollbar{height:3px}
    .files-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .file-chip{
      display:flex;align-items:center;gap:7px;
      background:var(--surface2);border:1px solid var(--border);
      border-radius:8px;padding:7px 12px;cursor:pointer;
      transition:all .2s;white-space:nowrap;flex-shrink:0;
    }
    .file-chip:hover{border-color:var(--accent);background:var(--surface3)}
    .file-chip.active{border-color:var(--accent);background:rgba(232,160,32,.08)}
    .file-chip.playing{border-color:var(--green);background:rgba(64,192,128,.08)}
    .chip-icon{font-size:14px}
    .chip-name{font-size:.75rem;color:var(--text2);max-width:140px;overflow:hidden;text-overflow:ellipsis}
    .file-chip:hover .chip-name,.file-chip.active .chip-name{color:var(--text)}
    .file-chip.playing .chip-name{color:var(--green)}

    /* ── LOADING ── */
    .loading-overlay{
      position:absolute;inset:0;background:rgba(0,0,0,.7);
      display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;
      backdrop-filter:blur(4px);
    }
    .loading-overlay.show{display:flex}
    .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:.82rem;color:var(--text2)}

    /* ── EMPTY ── */
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:8px;color:var(--text3);padding:20px;text-align:center}
    .empty-icon{font-size:32px;opacity:.4}
    .empty p{font-size:.8rem;line-height:1.5}

    /* PDF viewer */
    #pdfFrame{width:100%;height:100%;border:none;display:none}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">▶ Master Concursos</div>
    <div class="login-sub">Player de vídeo e materiais de estudo</div>
    <button class="btn-google" onclick="signIn()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>

</div>

<!-- APP -->

  <!-- TOPBAR -->
  <div class="topbar">

      </div>
    </div>
  </div>

<script>
// OAuth via redirecionamento — sem popup, funciona com qualquer antivírus
const CLIENT_ID = '275014603111-av3r44rb0shbah6v0kbrbh6bm94q6due.apps.googleusercontent.com';
const REDIRECT_URI = location.origin + location.pathname;
const SCOPE = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/userinfo.profile';

function signIn() {
  const url = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: SCOPE,
    include_granted_scopes: 'true',
  });
  location.href = url;
}

// Pega token do hash da URL após redirecionamento
function getTokenFromHash() {
  const hash = location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get('access_token');
}
</script>
<script>
const CLIENT_ID = '275014603111-av3r44rb0shbah6v0kbrbh6bm94q6due.apps.googleusercontent.com';
let accessToken = null;
let tokenClient = null;
let currentFileId = null;
let folderStack = []; // {id, name}
const VIDEO_TYPES = ['video/mp4','video/x-msvideo','video/quicktime','video/x-matroska','video/webm','video/mpeg'];
const PDF_TYPE = 'application/pdf';

// Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

window.onload = () => {
  // Pega token do hash após redirect do Google
  const tokenFromHash = getTokenFromHash();
  if (tokenFromHash) {
    accessToken = tokenFromHash;
    sessionStorage.setItem('drive_token', accessToken);
    sendTokenSW(accessToken);
    history.replaceState(null, '', location.pathname + location.search);
    onLogin();
    return;
  }
  // Token salvo na sessão
  const saved = sessionStorage.getItem('drive_token');
  if(saved){ accessToken = saved; sendTokenSW(accessToken); onLogin(); return; }
  // Abrir com Drive
  const p = new URLSearchParams(location.search);
  const state = p.get('state');
  if(state){ try{ const j=JSON.parse(decodeURIComponent(state)); if(j.ids?.length) sessionStorage.setItem('pending_id', j.ids[0]); }catch(e){} }
};

function sendTokenSW(t){
  navigator.serviceWorker.ready.then(r=>r.active?.postMessage({type:'SET_TOKEN',token:t}));
  if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type:'SET_TOKEN',token:t});
}
function signOut(){
  accessToken=null; sessionStorage.clear();
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function onLogin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  // User info
  try{
    const r=await gFetch('https://www.googleapis.com/oauth2/v3/userinfo');
    document.getElementById('userName').textContent=r.name||r.email||'';
    if(r.picture) document.getElementById('userPhoto').src=r.picture;
  }catch(e){}
  // Check pending
  const pending = sessionStorage.getItem('pending_id');
  if(pending){ sessionStorage.removeItem('pending_id'); await playFileById(pending); return; }
  // Load root
  await loadFolder('root','Meu Drive');
}

async function gFetch(url, raw=false){
  const r = await fetch(url, {headers:{Authorization:'Bearer '+accessToken}});
  if(raw) return r;
  return r.json();
}

// ── NAVIGATION ──
async function loadFolder(id, name){
  if(id==='root'){ folderStack=[{id:'root',name:'Meus Cursos'}]; }
  else {
    const idx = folderStack.findIndex(f=>f.id===id);
    if(idx>=0) folderStack=folderStack.slice(0,idx+1);
    else folderStack.push({id,name});
  }
  updateBreadcrumb();
  showSidebarLoading();

  try{
    const q = id === 'root' ? encodeURIComponent('sharedWithMe and trashed=false and mimeType='application/vnd.google-apps.folder'') : encodeURIComponent(`'${id}' in parents and trashed=false`);
    const fields = 'files(id,name,mimeType)';
    const data = await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=name&pageSize=200`);
    renderSidebar(data.files||[]);
    showFilesPanel(data.files||[]);
  }catch(e){
    showSidebarError();
  }
}

function goRoot(){ loadFolder('root','Meu Drive'); }

function updateBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = folderStack.map((f,i)=>{
    const isLast = i===folderStack.length-1;
    const sep = i>0?`<span class="bc-sep">›</span>`:'';
    return `${sep}<span class="bc-item${isLast?' active':''}" onclick="loadFolder('${f.id}','${f.name}')">${f.name}</span>`;
  }).join('');
}

function showSidebarLoading(){
  document.getElementById('sidebarList').innerHTML=`<div class="empty"><div class="spinner" style="width:24px;height:24px"></div></div>`;
}
function showSidebarError(){
  document.getElementById('sidebarList').innerHTML=`<div class="empty"><p>Erro ao carregar</p></div>`;
}

function renderSidebar(files){
  const folders = files.filter(f=>f.mimeType==='application/vnd.google-apps.folder');
  const videos = files.filter(f=>VIDEO_TYPES.includes(f.mimeType));
  const pdfs = files.filter(f=>f.mimeType===PDF_TYPE);

  let html='';
  if(!files.length){ html=`<div class="empty"><div class="empty-icon">📭</div><p>Pasta vazia</p></div>`; }
  
  if(folders.length){
    html+=folders.map(f=>`
      <div class="s-item" onclick="loadFolder('${f.id}','${escHtml(f.name)}')">
        <span class="s-icon">📁</span>
        <span class="s-name">${escHtml(f.name)}</span>
      </div>`).join('');
  }
  if(videos.length){
    if(folders.length) html+=`<div style="height:1px;background:var(--border);margin:4px 0"></div>`;
    html+=videos.map(f=>`
      <div class="s-item" id="si-${f.id}" onclick="playVideo('${f.id}','${escHtml(f.name)}')">
        <span class="s-icon">🎬</span>
        <span class="s-name">${escHtml(f.name)}</span>
      </div>`).join('');
  }
  if(pdfs.length){
    if(folders.length||videos.length) html+=`<div style="height:1px;background:var(--border);margin:4px 0"></div>`;
    html+=pdfs.map(f=>`
      <div class="s-item" id="si-${f.id}" onclick="openPdf('${f.id}','${escHtml(f.name)}')">
        <span class="s-icon">📕</span>
        <span class="s-name">${escHtml(f.name)}</span>
      </div>`).join('');
  }
  document.getElementById('sidebarList').innerHTML=html;
}

function showFilesPanel(files){
  const videos = files.filter(f=>VIDEO_TYPES.includes(f.mimeType));
  const pdfs = files.filter(f=>f.mimeType===PDF_TYPE);
  const all = [...videos,...pdfs];
  const panel = document.getElementById('filesPanel');
  if(!all.length){ panel.style.display='none'; return; }
  panel.style.display='flex';
  document.getElementById('filesList').innerHTML = all.map(f=>{
    const isVideo = VIDEO_TYPES.includes(f.mimeType);
    const icon = isVideo?'🎬':'📕';
    const action = isVideo?`playVideo('${f.id}','${escHtml(f.name)}')`:`openPdf('${f.id}','${escHtml(f.name)}')`;
    return `<div class="file-chip" id="fc-${f.id}" onclick="${action}">
      <span class="chip-icon">${icon}</span>
      <span class="chip-name">${escHtml(f.name)}</span>
    </div>`;
  }).join('');
}

// ── PLAYBACK ──
async function playVideo(id, name){
  currentFileId = id;
  setActiveItem(id);
  document.getElementById('topTitle').textContent = name;
  document.getElementById('noVideo').style.display='none';
  document.getElementById('pdfFrame').style.display='none';
  const v = document.getElementById('videoEl');
  v.style.display='block';
  document.getElementById('controls').style.display='block';
  document.getElementById('videoOverlay').style.display='flex';
  showLoading('Carregando vídeo...');

  const url = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&access_token=${encodeURIComponent(accessToken)}`;
  v.src = url;
  v.oncanplay = ()=>{ hideLoading(); v.play().catch(()=>{}); updatePlayIcon(); };
  v.onerror = ()=>{ hideLoading(); alert('Erro ao carregar vídeo. Verifique se tem permissão.'); };
}

async function playFileById(id){
  showLoading('Buscando arquivo...');
  try{
    const meta = await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?fields=name,mimeType,parents`);
    hideLoading();
    if(VIDEO_TYPES.includes(meta.mimeType)) playVideo(id, meta.name);
    else if(meta.mimeType===PDF_TYPE) openPdf(id, meta.name);
    if(meta.parents?.[0]) loadFolder(meta.parents[0],'');
  }catch(e){ hideLoading(); }
}

function openPdf(id, name){
  currentFileId = id;
  setActiveItem(id);
  document.getElementById('topTitle').textContent = name;
  document.getElementById('noVideo').style.display='none';
  document.getElementById('videoEl').style.display='none';
  document.getElementById('controls').style.display='none';
  document.getElementById('videoOverlay').style.display='none';
  const iframe = document.getElementById('pdfFrame');
  iframe.style.display='block';
  iframe.src = `https://drive.google.com/file/d/${id}/preview`;
}

function setActiveItem(id){
  document.querySelectorAll('.s-item,.file-chip').forEach(el=>{
    el.classList.remove('active','playing');
  });
  const si = document.getElementById('si-'+id);
  const fc = document.getElementById('fc-'+id);
  if(si){ si.classList.add('playing'); }
  if(fc){ fc.classList.add('playing'); }
}

// ── CONTROLS ──
const video = document.getElementById('videoEl');
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('ended', ()=>{ updatePlayIcon(); });
video.addEventListener('play', updatePlayIcon);
video.addEventListener('pause', updatePlayIcon);

function togglePlay(){
  if(video.paused) video.play();
  else video.pause();
}
function updatePlayIcon(){
  const icon = document.getElementById('playIcon');
  if(video.paused) icon.innerHTML='<path d="M8 5v14l11-7z"/>';
  else icon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
}
function skip(s){ video.currentTime = Math.max(0, video.currentTime+s); }
function updateProgress(){
  if(!video.duration) return;
  const pct = (video.currentTime/video.duration)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('timeDisplay').textContent=fmt(video.currentTime)+' / '+fmt(video.duration);
}
function fmt(s){
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}
document.getElementById('progressWrap').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  video.currentTime=((e.clientX-r.left)/r.width)*video.duration;
});
function setVolume(v){ video.volume=v; }
function toggleMute(){ video.muted=!video.muted; }
function toggleSpeedMenu(){
  document.getElementById('speedMenu').classList.toggle('open');
}
function setSpeed(s){
  video.playbackRate=s;
  document.getElementById('speedBtn').textContent=s+'x';
  document.querySelectorAll('.speed-opt').forEach(el=>{
    el.classList.toggle('active', parseFloat(el.textContent)===s);
  });
  document.getElementById('speedMenu').classList.remove('open');
}
function toggleFullscreen(){
  const el=document.getElementById('videoContainer');
  if(!document.fullscreenElement) el.requestFullscreen();
  else document.exitFullscreen();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.speed-btn')&&!e.target.closest('.speed-menu')){
    document.getElementById('speedMenu').classList.remove('open');
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowRight') skip(10);
  if(e.code==='ArrowLeft') skip(-10);
  if(e.code==='KeyF') toggleFullscreen();
});

// ── UTILS ──
function showLoading(t=''){
  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent=t;
}
function hideLoading(){
  document.getElementById('loadingOverlay').classList.remove('show');
}
function escHtml(s){ return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
</script>
</body>
</html>
